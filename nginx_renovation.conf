# 装修防宰攻略 · 笔记版 —— Nginx 反代模板
# 用法：
#   1) 把本文件放到 /etc/nginx/sites-available/renovation 并改 server_name 为你的域名
#   2) sudo ln -s /etc/nginx/sites-available/renovation /etc/nginx/sites-enabled/
#   3) 若用 80 端口：sudo certbot --nginx -d 你的域名   (自动签 HTTPS 证书)
#   4) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.example.com;   # ← 改成你的域名

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源与图片直出，减轻后端压力
    location /static/ {
        alias __DIR__/static/;
        expires 7d;
    }
    location /imgs/ {
        alias __DIR__/imgs/;
        expires 30d;
    }
}
